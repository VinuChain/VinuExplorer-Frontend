name: Legacy private image publish

on:
  # This is the upstream Blockscout private-image workflow. VinuExplorer's
  # production deploy path is docker-publish.yml -> backend deploy.yml, so keep
  # this available only for manual compatibility runs.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish_image:
    name: Publish Docker image
    uses: './.github/workflows/publish-image.yml'
    secrets: inherit
    with:
      tags: |
        type=ref,event=branch
        type=raw,value=unstable
      platforms: linux/amd64
