name: Trusted workflow boundary

on:
  pull_request_target:
    types: [ opened, synchronize, reopened, ready_for_review, labeled, unlabeled ]

permissions:
  contents: read
  pull-requests: read

jobs:
  workflow_boundary:
    name: Workflow boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable default-branch policy
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/workflow-policy
          persist-credentials: false

      - name: Collect the synthetic merge-result workflows as data
        id: collect
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = context.payload.pull_request.number;
            const protectedPolicies = new Set([
              '.github/workflows/workflow-boundary.yml',
              '.github/workflow-policy/verify.rb',
            ]);

            const changedFiles = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: pullNumber, per_page: 100 },
            );
            const protectedChange = changedFiles.find((file) =>
              protectedPolicies.has(file.filename) ||
              protectedPolicies.has(file.previous_filename)
            );
            if (protectedChange) {
              core.setFailed(
                `${protectedChange.filename} is a default-branch trust anchor and cannot be modified, deleted, or renamed by pull-request code`,
              );
              return;
            }

            const pull = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            const mergeSha = pull.data.merge_commit_sha;
            if (!mergeSha) {
              core.setFailed('A current synthetic merge commit is required for workflow policy evaluation');
              return;
            }

            const directory = await github.rest.repos.getContent({
              owner,
              repo,
              path: '.github/workflows',
              ref: mergeSha,
            });
            if (!Array.isArray(directory.data)) {
              core.setFailed('Expected .github/workflows to be a directory in the synthetic merge result');
              return;
            }

            const outputDirectory = path.join(
              process.env.RUNNER_TEMP,
              `workflow-boundary-${context.runId}-${context.runAttempt}`,
            );
            fs.rmSync(outputDirectory, { recursive: true, force: true });
            fs.mkdirSync(outputDirectory, { recursive: true });

            const workflowFiles = directory.data.filter(
              (entry) => entry.type === 'file' && /\.(?:yml|yaml)$/.test(entry.name),
            );
            for (const entry of workflowFiles) {
              if (path.basename(entry.name) !== entry.name) {
                core.setFailed(`Unsafe workflow filename ${entry.name}`);
                return;
              }
              const response = await github.rest.repos.getContent({
                owner,
                repo,
                path: entry.path,
                ref: mergeSha,
              });
              if (Array.isArray(response.data) || response.data.type !== 'file') {
                core.setFailed(`Expected ${entry.path} to be a file`);
                return;
              }
              const source = Buffer.from(
                response.data.content,
                response.data.encoding,
              ).toString('utf8');
              fs.writeFileSync(path.join(outputDirectory, entry.name), source, {
                encoding: 'utf8',
                flag: 'wx',
              });
            }

            core.setOutput('directory', outputDirectory);
            core.info(
              `Collected ${workflowFiles.length} workflow files from synthetic merge ${mergeSha}.`,
            );

      - name: Set up trusted policy runtime
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1
        with:
          ruby-version: '3.3'

      - name: Parse and enforce workflow policy
        run: ruby .github/workflow-policy/verify.rb '${{ steps.collect.outputs.directory }}'
