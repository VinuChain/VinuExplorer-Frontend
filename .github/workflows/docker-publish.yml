name: Build and push Docker image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# No workflow-level `concurrency:` block here.
#
# GH Actions concurrency keeps at most ONE pending run per group: when run A
# is in-progress and run B is pending, a third push lands and B is silently
# cancelled before it ever starts. That violates the "every push produces
# its own immutable :<short-sha> tag" promise and skips the backend deploy
# trigger for the cancelled commit's image.
#
# Serialisation where it actually matters (the RPC-box deploy) is handled
# by vinuexplorer-backend/.github/workflows/deploy.yml's own concurrency
# block with cancel-in-progress:false. Letting these builds run in parallel
# here is safe — GHA layer cache supports concurrent writes, and the SHORT
# SHA tag is per-commit so there's no race on the artifact name.

jobs:
  # Quality gate for the production deploy path.
  #
  # Pushes to `main` go straight to image build + backend redeploy, so the
  # ESLint / TypeScript / envs-validator / Vitest gate that runs on PRs must
  # also run here — otherwise a direct push (or a squashed merge that skipped
  # PR checks) can reach production without ever passing them. `checks.yml`
  # already exposes `workflow_call`; reuse it verbatim so there is a single
  # source of truth for the gate.
  checks:
    uses: ./.github/workflows/checks.yml
    secrets: inherit
    # checks.yml declares `pull-requests: write` (for its PR-only comment step).
    # A reusable workflow cannot elevate the GITHUB_TOKEN above the caller, so
    # this caller job must grant at least what the callee requests or the run
    # fails validation before build-and-push. On the push/deploy path the PR
    # step never executes (it is pull_request-gated), so this scope is unused
    # here — it only satisfies the permission contract.
    permissions:
      contents: read
      pull-requests: write

  build-and-push:
    name: Build and push
    needs: [ checks ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set SHORT_SHA
        run: echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-8)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Choose Docker cache export policy
        id: cache-policy
        run: |
          set -euo pipefail

          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "cache_to=type=gha,mode=max" >> "$GITHUB_OUTPUT"
            echo "No parent commit available; exporting Docker cache."
            exit 0
          fi

          if git diff --name-only HEAD^ HEAD | grep -Eq '^(Dockerfile|package.json|yarn.lock|tsconfig\.json|configs/app/|toolkit/theme/|toolkit/chakra/color-mode\.tsx|toolkit/utils/(isBrowser|regexp|url)\.ts|toolkit/components/forms/validators/url\.ts|lib/api/types\.ts|lib/settings/colorTheme\.ts|types/api/(contract|contracts)\.ts|types/client/(adButlerConfig|adProviders|addressProfileAPIConfig|contract|deFiDropdown|externalTxsConfig|gasRefuelProviderConfig|gasTracker|marketplace|multichainProviderConfig|navigation|rollup|token|txInterpretation|validators|wallets)\.ts|types/views/|types/(externalChains|homepage|multichain|networks|settings|ui|utils)\.ts)'; then
            echo "cache_to=type=gha,mode=max" >> "$GITHUB_OUTPUT"
            echo "Docker dependency inputs changed; exporting Docker cache."
          else
            echo "cache_to=" >> "$GITHUB_OUTPUT"
            echo "Docker dependency inputs unchanged; skipping Docker cache export."
          fi

      - name: Build and push
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: true
          tags: |
            ghcr.io/vinuchain/vinuexplorer-frontend:latest
            ghcr.io/vinuchain/vinuexplorer-frontend:${{ env.SHORT_SHA }}
          build-args: |
            GIT_COMMIT_SHA=${{ env.SHORT_SHA }}
            GIT_TAG=${{ github.ref_name }}
          # GHA layer cache cuts incremental builds from ~22 min to ~5-8 min
          # by reusing the npm-install + next-build layers across runs.
          cache-from: type=gha
          cache-to: ${{ steps.cache-policy.outputs.cache_to }}

      - name: Trigger backend deployment
        if: success()
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "BACKEND_DEPLOY_TOKEN secret not set; cannot trigger backend deployment"
            exit 1
          fi
          gh workflow run deploy.yml \
            --repo VinuChain/vinuexplorer-backend \
            --ref master \
            -f frontend_image_tag="$SHORT_SHA"
        env:
          GH_TOKEN: ${{ secrets.BACKEND_DEPLOY_TOKEN }}
