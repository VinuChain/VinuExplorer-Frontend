name: Trusted workflow boundary

on:
  pull_request_target:
    types: [ opened, synchronize, reopened, ready_for_review, labeled, unlabeled ]

permissions:
  contents: read
  pull-requests: read

jobs:
  workflow_boundary:
    name: Workflow boundary
    runs-on: ubuntu-latest
    steps:
      - name: Require the repository default branch as the PR target
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$PR_BASE_REF" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Trusted workflow policy only accepts pull requests targeting the repository default branch"
            exit 1
          fi

      - name: Checkout immutable default-branch policy
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/workflow-policy
            scripts/workflow-policy-collect.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Collect the synthetic merge-result workflows as data
        id: collect
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const policyPath = path.join(
              process.env.GITHUB_WORKSPACE,
              'scripts',
              'workflow-policy-collect.mjs',
            );
            const policy = await import(pathToFileURL(policyPath).href);
            await policy.collectWorkflowPolicyInput({
              github,
              context,
              core,
              fs,
              path,
              runnerTemp: process.env.RUNNER_TEMP,
            });

      - name: Set up trusted policy runtime
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1
        with:
          ruby-version: '3.3'

      - name: Parse and enforce workflow policy
        run: |
          ruby .github/workflow-policy/verify_test.rb '${{ steps.collect.outputs.directory }}'
          ruby .github/workflow-policy/verify.rb '${{ steps.collect.outputs.directory }}'
