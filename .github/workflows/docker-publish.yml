name: Build and push Docker image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# Serialise concurrent main pushes so we don't waste GHCR cache slots and
# don't fire two backend deploys racing for the same RPC boxes. Each push
# still produces its own immutable :<short-sha> tag — only the build queue
# is serialised.
concurrency:
  group: docker-publish-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set SHORT_SHA
        run: echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-8)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/vinuchain/vinuexplorer-frontend:latest
            ghcr.io/vinuchain/vinuexplorer-frontend:${{ env.SHORT_SHA }}
          build-args: |
            GIT_COMMIT_SHA=${{ env.SHORT_SHA }}
            GIT_TAG=${{ github.ref_name }}
          # GHA layer cache cuts incremental builds from ~22 min to ~5-8 min
          # by reusing the npm-install + next-build layers across runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger backend deployment
        if: success()
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "BACKEND_DEPLOY_TOKEN secret not set; cannot trigger backend deployment"
            exit 1
          fi
          gh workflow run deploy.yml \
            --repo VinuChain/vinuexplorer-backend \
            --ref master \
            -f frontend_image_tag="$SHORT_SHA"
        env:
          GH_TOKEN: ${{ secrets.BACKEND_DEPLOY_TOKEN }}
