name: Trusted workflow boundary

on:
  pull_request_target:
    types: [ opened, synchronize, reopened, ready_for_review, labeled, unlabeled ]

permissions:
  contents: read
  pull-requests: read

jobs:
  workflow_boundary:
    name: Workflow boundary
    runs-on: ubuntu-latest
    steps:
      - name: Inspect pull-request workflows without executing pull-request code
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;
            const headOwner = context.payload.pull_request.head.repo.owner.login;
            const headRepo = context.payload.pull_request.head.repo.name;
            const protectedPolicy = '.github/workflows/workflow-boundary.yml';
            const violations = [];

            const changedFiles = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: pullNumber, per_page: 100 },
            );
            if (changedFiles.some((file) =>
              file.filename === protectedPolicy || file.previous_filename === protectedPolicy
            )) {
              violations.push(
                `${protectedPolicy} is the default-branch trust anchor and cannot be modified by pull-request code`,
              );
            }

            const directory = await github.rest.repos.getContent({
              owner: headOwner,
              repo: headRepo,
              path: '.github/workflows',
              ref: headSha,
            });
            if (!Array.isArray(directory.data)) {
              throw new Error('Expected .github/workflows to be a directory');
            }

            const workflowFiles = directory.data.filter(
              (entry) => entry.type === 'file' && /\.(?:yml|yaml)$/.test(entry.name),
            );
            const sources = new Map();
            for (const entry of workflowFiles) {
              const response = await github.rest.repos.getContent({
                owner: headOwner,
                repo: headRepo,
                path: entry.path,
                ref: headSha,
              });
              if (Array.isArray(response.data) || response.data.type !== 'file') {
                throw new Error(`Expected ${entry.path} to be a file`);
              }
              sources.set(
                entry.name,
                Buffer.from(response.data.content, response.data.encoding).toString('utf8').replaceAll('\r\n', '\n'),
              );
            }

            const productionArtifact = sources.get('docker-publish.yml');
            if (!productionArtifact) {
              violations.push('docker-publish.yml is required');
            } else {
              for (const forbidden of [
                'Trigger backend deployment',
                'gh workflow run deploy.yml',
                'BACKEND_DEPLOY_TOKEN',
              ]) {
                if (productionArtifact.includes(forbidden)) {
                  violations.push(
                    `docker-publish.yml must publish an immutable image only; found ${JSON.stringify(forbidden)}`,
                  );
                }
              }
              if (/ghcr\.io\/vinuchain\/vinuexplorer-frontend:latest(?:\s|$)/.test(productionArtifact)) {
                violations.push(
                  'docker-publish.yml must not publish the mutable latest image before a controller deployment permit',
                );
              }
            }

            const upstreamOnlyJobs = {
              'cleanup.yml': [
                'cleanup_release',
                'cleanup_l2_release',
                'cleanup_docker_image',
              ],
              'deploy-main.yml': [ 'publish_image' ],
              'deploy-review.yml': [ 'make_slug', 'publish_image', 'deploy_review' ],
              'deploy-review-l2.yml': [ 'make_slug', 'publish_image', 'deploy_review_l2' ],
              'e2e-tests.yml': [ 'publish_image', 'deploy_e2e', 'test' ],
              'publish-image.yml': [ 'run' ],
            };
            const upstreamProviderPattern =
              /blockscout\/actions|vault\.k8s\.blockscout\.com|ghcr\.io\/blockscout/;

            for (const [ file, jobs ] of Object.entries(upstreamOnlyJobs)) {
              const source = sources.get(file);
              if (!source) {
                violations.push(`${file} is required by the owner-gated workflow allowlist`);
                continue;
              }
              for (const job of jobs) {
                const guardedJob = new RegExp(
                  `^([ \\t]+)${job}:\\n\\1(?:  |    )if: github\\.repository_owner == 'blockscout'$`,
                  'm',
                );
                if (!guardedJob.test(source)) {
                  violations.push(
                    `${file} job ${job} is not restricted to the upstream Blockscout owner`,
                  );
                }
              }
            }

            for (const [ file, source ] of sources) {
              if (upstreamProviderPattern.test(source) && !(file in upstreamOnlyJobs)) {
                violations.push(
                  `${file} references an upstream Blockscout provider but is not in the explicit owner-gated allowlist`,
                );
              }
            }

            if (violations.length > 0) {
              core.setFailed(`Workflow boundary violations:\n- ${violations.join('\n- ')}`);
            } else {
              core.info(`Trusted policy inspected ${workflowFiles.length} workflow files at ${headSha}.`);
            }
